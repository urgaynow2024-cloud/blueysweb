<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5ab0f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4fd1c5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Bone shape -->
  <g filter="url(#glow)">
    <!-- Left round end -->
    <circle cx="14" cy="20" r="8" fill="url(#boneGrad)" />
    <circle cx="14" cy="44" r="8" fill="url(#boneGrad)" />
    
    <!-- Middle connector -->
    <rect x="14" y="26" width="36" height="12" rx="6" fill="url(#boneGrad)" />
    
    <!-- Right round end -->
    <circle cx="50" cy="20" r="8" fill="url(#boneGrad)" />
    <circle cx="50" cy="44" r="8" fill="url(#boneGrad)" />
    
    <!-- Inner cutouts for bone holes -->
    <circle cx="14" cy="20" r="3" fill="#03050a" />
    <circle cx="14" cy="44" r="3" fill="#03050a" />
    <circle cx="50" cy="20" r="3" fill="#03050a" />
    <circle cx="50" cy="44" r="3" fill="#03050a" />
  </g>
  
  <!-- Subtle shine -->
  <ellipse cx="20" cy="16" rx="3" ry="2" fill="rgba(255,255,255,0.3)" transform="rotate(-20 20 16)" />
  <ellipse cx="20" cy="48" rx="3" ry="2" fill="rgba(255,255,255,0.3)" transform="rotate(-20 20 48)" />
</svg>
